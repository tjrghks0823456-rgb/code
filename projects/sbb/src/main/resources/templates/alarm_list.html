<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::section})}">
<section class="container my-3">
    <h2>장비 알람 목록</h2>

    <a class="btn btn-primary" th:href="@{/alarm/create}">수동 알람 등록</a>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
            <tr>
                <th>번호</th>
                <th>장비명</th>
                <th>알람 코드</th>
                <th>등급</th>
                <th>발생 일시</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="alarm, loop : ${alarmList}">
                <td th:text="${loop.count}"></td>
                <td th:text="${alarm.equipmentName}"></td>
                <td>
                    <a th:href="@{|/alarm/detail/${alarm.id}|}" th:text="${alarm.alarmCode}"></a>
                </td>
                <td th:text="${alarm.alarmLevel}"></td>
                <td th:text="${#temporals.format(alarm.createDate, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
        </tbody>
    </table>
</section>
</html>
