<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section})}">

<section class="container my-3">

    <!-- 질문 제목 -->
    <h2 class="border-bottom py-2" th:text="${question.subject}"></h2>

    <!-- 질문 내용 카드 -->
    <div class="card my-3">
        <div class="card-body">
            <!-- 질문 내용 -->
            <div class="card-text"
                 style="white-space: pre-line;"
                 th:text="${question.content}">
            </div>

            <!-- 질문 작성일 -->
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start">
                    <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>

            <!-- 수정 / 삭제 / 목록 버튼 -->
            <div class="my-3">
                <a th:href="@{|/question/modify/${question.id}|}" class="btn btn-sm btn-outline-secondary">
                    수정
                </a>
                <a th:href="@{|/question/delete/${question.id}|}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('정말 삭제하시겠습니까?');">
                    삭제
                </a>
                <a th:href="@{|/question/list|}" class="btn btn-sm btn-outline-primary">
                    목록
                </a>
            </div>
        </div>
    </div>

    <!-- 답변 개수 표시 -->
    <h5 class="border-bottom my-3 py-2"
        th:text="|${#lists.size(question.answerList)}개의 답변이 있습니다.|">
    </h5>

    <!-- 답변 반복 출력 -->
    <div class="card my-3" th:each="answer : ${question.answerList}">
        <div class="card-body">
            
            <!-- 답변 내용 -->
            <div class="card-text"
                 style="white-space: pre-line;"
                 th:text="${answer.content}">
            </div>

            <!-- 답변 작성일 -->
            <div class="d-flex justify-content-end">
                <div class="badge bg-light text-dark p-2 text-start">
                    <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 답변 작성 폼 -->
    <form th:action="@{|/answer/create/${question.id}|}" method="post" class="my-3">
        <textarea name="content"
                  id="content"
                  rows="10"
                  class="form-control"></textarea>

        <input type="submit"
               value="답변등록"
               class="btn btn-primary my-2">
    </form>

</section>

</html>
